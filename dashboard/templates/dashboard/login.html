{% extends "dashboard/base.html" %}

{% block title %}Sign in — Bymer Dashboard{% endblock %}

{% block body %}
<main class="min-h-full flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white rounded-lg shadow-sm border border-slate-200 p-6">
  <h1 class="text-xl font-semibold mb-1">Sign in</h1>
  <p class="text-sm text-slate-600 mb-6">Staff access for website content management.</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% if form.non_field_errors %}
    <div class="text-sm text-red-700">{{ form.non_field_errors }}</div>
    {% endif %}
    <div>
      <label class="block text-sm font-medium mb-1" for="id_username">Username</label>
      <input type="text" name="username" id="id_username" required autofocus
             class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="id_password">Password</label>
      <input type="password" name="password" id="id_password" required
             class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
    </div>
    <button type="submit" class="w-full rounded bg-slate-900 text-white py-2 text-sm font-medium hover:bg-slate-800">
      Sign in
    </button>
  </form>
</div>
</main>
{% endblock %}
