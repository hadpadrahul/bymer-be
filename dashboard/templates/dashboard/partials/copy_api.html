<div class="rounded border border-slate-200 bg-slate-50 p-3 text-sm space-y-2">
  <p class="font-medium text-slate-700">Public API</p>
  <p class="font-mono text-xs break-all text-slate-600">{{ path }}</p>
  <button type="button"
          class="rounded border border-slate-300 bg-white px-2 py-1 text-xs hover:bg-slate-100"
          onclick="navigator.clipboard.writeText('{{ absolute_url|escapejs }}')">
    Copy full URL
  </button>
  <button type="button"
          class="rounded border border-slate-300 bg-white px-2 py-1 text-xs hover:bg-slate-100 ml-1"
          onclick="navigator.clipboard.writeText('{{ path|escapejs }}')">
    Copy path
  </button>
</div>
