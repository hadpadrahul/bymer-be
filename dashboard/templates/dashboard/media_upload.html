{% extends "dashboard/base_staff.html" %}
{% block title %}Upload media — Dashboard{% endblock %}
{% block content %}
<div class="max-w-lg">
  <h1 class="text-2xl font-semibold mb-4">Upload media</h1>
  <form method="post" enctype="multipart/form-data" class="space-y-4 rounded-lg border border-slate-200 bg-white p-6">
    {% csrf_token %}
    {{ form.file.label_tag }}
    {{ form.file }}
    {% if form.file.errors %}<p class="text-xs text-red-600">{{ form.file.errors }}</p>{% endif %}
    <button type="submit" class="rounded bg-slate-900 text-white px-4 py-2 text-sm">Upload</button>
  </form>
</div>
{% endblock %}
